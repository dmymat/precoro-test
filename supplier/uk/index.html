const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const toLogin=()=>location.replace("../../?next="+encodeURIComponent(location.pathname+location.hash));
async function open_(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
 const h=new TextDecoder().decode(pt); document.open(); document.write(h); document.close();
}
const saved=sessionStorage.getItem("pw");
if(saved) open_(saved).catch(()=>{sessionStorage.removeItem("pw");toLogin();}); else toLogin();
